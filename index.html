<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gcnasm notes</title>
<meta name="description" content="Write-ups that go with experiments in carlushuang/gcnasm.">
<style>
:root {
  --bg: #ffffff;
  --fg: #1b1f24;
  --muted: #5b6672;
  --line: #d8dee4;
  --soft: #f6f8fa;
  --accent: #b3122b;
  --accent-soft: #fdf0f2;
  --ok: #1a7f37;
  --warn: #9a6700;
  --code-bg: #f6f8fa;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #9198a1;
    --line: #2b313a;
    --soft: #161b22;
    --accent: #ff7b8a;
    --accent-soft: #21161a;
    --ok: #3fb950;
    --warn: #d29922;
    --code-bg: #161b22;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 20px 96px; }
header.hero { border-bottom: 1px solid var(--line); background: var(--soft); padding: 48px 0 34px; margin-bottom: 40px; }
header.hero .wrap { padding-bottom: 0; }
h1 { font-size: 34px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 18px; margin: 0 0 20px; max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 12px/1 var(--mono);
  padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--bg); color: var(--muted); text-decoration: none;
}
.chip a, a.chip:hover { color: var(--accent); }
.chip.hot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
h2 {
  font-size: 24px; margin: 52px 0 14px; letter-spacing: -0.01em;
  padding-top: 10px; border-top: 1px solid var(--line);
}
h2 .num { color: var(--accent); font: 600 14px/1 var(--mono); display: block; margin-bottom: 6px; }
h3 { font-size: 17px; margin: 30px 0 8px; }
p { margin: 0 0 14px; }
ul, ol { margin: 0 0 14px; padding-left: 22px; }
li { margin-bottom: 6px; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
code { font: 13px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; }
pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.55; }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 8px 8px 0; padding: 14px 18px; margin: 0 0 20px; }
.callout p:last-child { margin-bottom: 0; }
.callout .label { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 8px; }
table { border-collapse: collapse; width: 100%; margin: 0 0 18px; font-size: 14.5px; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.ok { color: var(--ok); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }
figure { margin: 24px 0; }
figure svg { width: 100%; height: auto; display: block; }
figcaption { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
.svgbox { border: 1px solid var(--line); border-radius: 8px; background: var(--soft); padding: 18px; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--fg); }
svg text.t { font-size: 12px; font-weight: 600; }
svg text.s { fill: var(--muted); font-size: 10px; }
svg rect.box { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
svg rect.hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
svg line, svg path.ln { stroke: var(--muted); stroke-width: 1.2; fill: none; }
svg path.acc { stroke: var(--accent); stroke-width: 1.4; fill: none; }
.toc { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
.toc ol { margin: 0; padding-left: 20px; }
.toc li { margin-bottom: 3px; }
footer { border-top: 1px solid var(--line); margin-top: 60px; padding-top: 20px; color: var(--muted); font-size: 14px; }
.small { font-size: 13.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } h1 { font-size: 27px; } }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--bg); }
.card h4 { margin: 0 0 6px; font-size: 14px; }
.card p { margin: 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>gcnasm notes</h1>
    <p class="sub">Write-ups that go with experiments in <a href="https://github.com/carlushuang/gcnasm">carlushuang/gcnasm</a>.</p>
  </div>
</header>

<div class="wrap">

<div class="grid2">
  <div class="card">
    <h4><a href="nps-locality.html">IOD locality on MI355X</a></h4>
    <p>How a kernel finds its IOD and where an address lives in SPX + NPS1, what IOD-local placement buys, why a fused MoE barely gains, and how DeepGEMM does the same on B200. Code and data: <a href="https://github.com/carlushuang/gcnasm/pull/55">#55</a>.</p>
  </div>
</div>

</div>
</body>
</html>
