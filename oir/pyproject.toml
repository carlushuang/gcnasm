[project]
name = "opus-ir"
version = "0.1.0"
description = "Typed, hardware-explicit AMDGPU schedule IR whose vocabulary is opus.hpp"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"src/opus_ir/__init__.py" = ["F401"]
